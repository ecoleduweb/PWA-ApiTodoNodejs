openapi: 3.0.0
info:
  title: Bank API
  version: 1.0.0
servers:
- url: http://localhost:3001/api/
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lastName:
                  type: string
                firstName:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              example:
                lastName: "Jackson"
                firstName: "Michael"
                email: "michael@jackson.com"
                password: "Patate123"
  /auth/login:
    post:
      summary: Login a user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: User logged in successfully
          content:
            application/json:
              example:
                email: "michael@jackson.com"
                password: "Patate123"
  /auth/logout:
    post:
      summary: Logout a user
      tags:
        - Authentication
      responses:
        200:
          description: User logged out successfully
          content:
            application/json:
              example:
                message: "User logged out successfully"
  /accounts:
    get:
      summary: List the authenticated user's accounts
      tags:
        - Accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts belonging to the authenticated user (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: Missing, invalid or expired bearer token
        '500':
          description: Server configuration or database error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      type: object
      required: [id, userId, balance, openedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        balance:
          type: string
          example: '10000.00'
        openedAt:
          type: string
          format: date-time
